[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drugdesign"
version = "0.3.0"
description = "A Python framework for QSAR activity prediction and docking-based virtual screening"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "rdkit>=2023.9.1",
    "scikit-learn>=1.2",
    "joblib>=1.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
docking = ["vina>=1.2.5", "meeko>=0.5"]
dev = ["pytest>=7", "ruff>=0.9", "build>=1.2"]

[project.scripts]
drugdesign = "drugdesign.cli:main"

[tool.setuptools.packages.find]
include = ["drugdesign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
